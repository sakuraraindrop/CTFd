{% extends "base.html" %}

{% block content %}
  <div
    class="container challenge-board-shell"
    x-data="ChallengeBoard"
    @load-challenges.window="loadChallenges()"
    @load-challenge.window="loadChallenge($event.detail)"
  >
    <section class="challenge-hero">
      <div class="challenge-hero__copy">
        <h1>卫星网络安全竞赛</h1>
        <p class="challenge-hero__lead">
          聚焦卫星链路、空间系统与地面网络的综合攻防场景。
        </p>
        <p class="challenge-hero__lead challenge-hero__lead--subtle">
          题目覆盖真实环境下的渗透、利用、分析与实战推演流程。
        </p>
      </div>

      <div class="challenge-hero__visual" aria-hidden="true">
        <div class="challenge-hero__planet-glow"></div>
        <div class="challenge-hero__planet"></div>
        <div class="challenge-hero__orbit challenge-hero__orbit--outer"></div>
        <div class="challenge-hero__orbit challenge-hero__orbit--mid"></div>
        <div class="challenge-hero__orbit challenge-hero__orbit--inner"></div>
        <div class="challenge-hero__satellite challenge-hero__satellite--alpha">
          <i class="fas fa-satellite"></i>
        </div>
        <div class="challenge-hero__satellite challenge-hero__satellite--beta">
          <i class="fas fa-broadcast-tower"></i>
        </div>
        <div class="challenge-hero__signal"></div>
      </div>

      <div class="challenge-hero__stats">
        <article class="challenge-hero__stat-card">
          <span class="challenge-hero__stat-label">赛题总数</span>
          <strong class="challenge-hero__stat-value" x-text="challenges.length"></strong>
        </article>
        <article class="challenge-hero__stat-card">
          <span class="challenge-hero__stat-label">题目分类</span>
          <strong class="challenge-hero__stat-value" x-text="getCategories().length"></strong>
        </article>
        <article class="challenge-hero__stat-card">
          <span class="challenge-hero__stat-label">已完成</span>
          <strong
            class="challenge-hero__stat-value"
            x-text="challenges.filter(challenge => challenge.solved_by_me).length"
          ></strong>
        </article>
      </div>
    </section>

    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div>
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade orbit-modal" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="challenge-loading min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="category in getCategories()" :key="category">
          <section class="challenge-category pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="c in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >
                      <div class="challenge-inner">
                        <div class="challenge-card__topline">
                          <span
                            class="challenge-card__status"
                            :class="c.solved_by_me ? 'challenge-card__status--solved' : 'challenge-card__status--open'"
                            x-text="c.solved_by_me ? '已完成' : '未完成'"
                          ></span>
                        </div>
                        <p class="challenge-card__name" x-text="c.name"></p>
                        <div class="challenge-card__meta">
                          <span class="challenge-card__value" x-text="`${c.value} 分`"></span>
                          <span class="challenge-card__arrow">
                            <i class="fas fa-arrow-right"></i>
                          </span>
                        </div>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
