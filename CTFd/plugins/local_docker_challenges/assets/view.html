{% extends "challenge.html" %}

{% block description %}
{{ super() }}

<div class="row pb-3">
  <div class="col-12">
    <section class="ldc-console">
      <div id="ldc-panel-loading" class="card ldc-panel">
        <div class="card-body">
          <div class="ldc-panel__layout">
            <span class="ldc-state-chip ldc-state-chip--sync">
              <i class="fas fa-satellite-dish"></i>
              正在加载
            </span>
          </div>
        </div>
      </div>

      <div id="ldc-panel-stopped" class="card ldc-panel" style="display: none;">
        <div class="card-body">
          <div class="ldc-panel__layout ldc-panel__layout--split">
            <div class="ldc-status-block">
              <span class="ldc-state-chip ldc-state-chip--idle">
                <i class="fas fa-circle"></i>
                未启动
              </span>
              <p class="ldc-status-caption">容器状态</p>
            </div>
            <div class="ldc-action-block">
              <button id="ldc-boot-button" class="btn btn-primary ldc-action-btn" type="button" onclick="window.localDockerChallenge.boot()">
                <i class="fas fa-rocket"></i>
                启动容器
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="ldc-panel-started" class="card ldc-panel" style="display: none;">
        <div class="card-body">
          <div class="ldc-panel__layout">
            <div class="ldc-panel__topline">
              <span class="ldc-state-chip ldc-state-chip--live">
                <i class="fas fa-signal"></i>
                运行中
              </span>
              <h6 id="ldc-panel-until" class="card-subtitle text-muted ldc-panel__timer" style="display: none;">
                剩余时间：<span id="ldc-count-down"></span>
              </h6>
            </div>
            <div class="ldc-endpoint">
              <code>
                <a id="ldc-connection-link" href="#" target="_blank" rel="noopener noreferrer">
                  <span id="ldc-connection-info"></span>
                </a>
              </code>
            </div>
            <div class="ldc-actions">
              <button id="ldc-copy-button" type="button" class="btn btn-outline-primary ldc-action-btn" onclick="window.localDockerChallenge.copyConnection()">
                <i class="fas fa-copy"></i>
                复制链接
              </button>
              <button id="ldc-open-button" type="button" class="btn btn-outline-dark ldc-action-btn" onclick="window.localDockerChallenge.openConnection()">
                <i class="fas fa-arrow-up-right-from-square"></i>
                打开
              </button>
              <button id="ldc-renew-button" type="button" class="btn btn-success ldc-action-btn" onclick="window.localDockerChallenge.renew()">
                <i class="fas fa-clock-rotate-left"></i>
                续期
              </button>
              <button id="ldc-destroy-button" type="button" class="btn btn-danger ldc-action-btn" onclick="window.localDockerChallenge.destroy()">
                <i class="fas fa-power-off"></i>
                销毁
              </button>
              <button id="ldc-restart-button" type="button" class="btn btn-secondary ldc-action-btn" onclick="window.localDockerChallenge.restart()">
                <i class="fas fa-rotate-right"></i>
                重启
              </button>
            </div>
            <p id="ldc-inline-status" class="small text-muted ldc-inline-status" style="display: none;"></p>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
{% endblock %}
