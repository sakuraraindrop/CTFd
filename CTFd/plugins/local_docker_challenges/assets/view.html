{% extends "challenge.html" %}

{% block description %}
{{ super() }}

<div class="row text-center pb-3">
  <div style="width: 100%;">
    <div id="ldc-panel-loading" class="card" style="width: 100%;">
      <div class="card-body">
        <h5 class="card-title">Instance Info</h5>
        <h6 class="card-subtitle mb-2 text-muted">Loading...</h6>
      </div>
    </div>

    <div id="ldc-panel-stopped" class="card" style="width: 100%; display: none;">
      <div class="card-body">
        <h5 class="card-title">Instance Info</h5>
        <p class="card-text text-muted">No running instance for this challenge.</p>
        <button class="btn btn-primary" type="button" onclick="window.localDockerChallenge.boot()">
          Launch Container
        </button>
      </div>
    </div>

    <div id="ldc-panel-started" class="card" style="width: 100%; display: none;">
      <div class="card-body">
        <h5 class="card-title">Instance Info</h5>
        <h6 id="ldc-panel-until" class="card-subtitle mb-2 text-muted" style="display: none;">
          Remaining Time: <span id="ldc-count-down"></span>
        </h6>
        <code><span id="ldc-connection-info"></span></code>
        <div class="mt-3">
          <button type="button" class="btn btn-success" onclick="window.localDockerChallenge.renew()">
            Renew
          </button>
          <button type="button" class="btn btn-danger" onclick="window.localDockerChallenge.destroy()">
            Destroy
          </button>
          <button type="button" class="btn btn-secondary" onclick="window.localDockerChallenge.restart()">
            Restart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
